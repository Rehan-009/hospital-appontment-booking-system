<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HABS | Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/register.css') }}"
    >
</head>

<body>

    <header class="topbar">

        <div class="nav-container">

            <a href="{{ url_for('home') }}" class="brand">

                <span class="brand-icon">
                    <i class="fa-solid fa-heart-pulse"></i>
                </span>

                <span>Hospital Connect</span>

            </a>

            <a href="{{ url_for('home') }}" class="back-home">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Home
            </a>

        </div>

    </header>


    <main class="register-wrapper">

        <section class="register-card">

            <div class="form-header">

                <div class="register-icon">
                    <i class="fa-solid fa-id-card" style="color: rgb(16, 101, 168);"></i>
                </div>

                <h1>Create Your Account</h1>

                <p>
                    Register as a patient to book appointments
                    and manage your healthcare.
                </p>

            </div>


            <form id="registerForm" autocomplete="off">

                <div class="form-row">

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-user"></i>

                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Mobile Number
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-phone"></i>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Enter mobile number"
                                maxlength="10"
                                required
                            >

                        </div>

                    </div>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="dob">
                            Date of Birth
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-calendar"></i>

                            <input
                                type="date"
                                id="dob"
                                name="dob"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="gender">
                            Gender
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-venus-mars"></i>

                            <select id="gender" name="gender" required>

                                <option value="">
                                    Select Gender
                                </option>

                                <option value="male">
                                    Male
                                </option>

                                <option value="female">
                                    Female
                                </option>

                                <option value="other">
                                    Other
                                </option>

                            </select>

                        </div>

                    </div>
                    <div class="form-group">

                         <label for="role">
                              Register As
                                 </label>

                                 <div class="input-box">

                                    <i class="fa-solid fa-users"></i>

                                      <select id="role" name="role" required>

                                        <option value="">
                                           Select Role
                                        </option>

                                       <option value="patient">
                                           Patient
                                       </option>

                                       <option value="doctor">
                                           Doctor
                                       </option>

                                     </select>

                                  </div>

                            </div>

                        </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <div class="password-strength">

                    <div class="strength-bar">
                        <span id="strengthBar"></span>
                    </div>

                    <p id="strengthText">
                        Password strength
                    </p>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>

                </div>


                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the
                        <a href="#">Terms & Conditions</a>
                        and
                        <a href="#">Privacy Policy</a>.
                    </span>

                </label>


                <button
                    type="submit"
                    class="register-btn"
                >
                    <i class="fa-solid fa-user-plus"></i>
                    Create Account
                </button>


                <p class="login-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </form>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Hospital Connect. College PBL Prototype.
        </p>

    </footer>


    <script src="{{ url_for('static', filename='js/register.js') }}"></script>

</body>

</html>
